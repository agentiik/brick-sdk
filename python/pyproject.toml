[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentiik-brick"
version = "0.8.0"
description = "Optional helpers for the Agentiik brick contract: envelopes, parameters, run context, secrets, size rules and exit codes."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.urls]
Documentation = "https://agentiik.github.io/docs#brick"
Source = "https://github.com/agentiik/brick-sdk"

[tool.setuptools.packages.find]
where = ["src"]
