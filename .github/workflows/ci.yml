# Each helper is tested in its own language against the scenarios in conformance/, so that the
# three keep the same surface and the same behaviour rather than three readings of the contract.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt would rewrite:"; echo "$unformatted"; exit 1; fi
      # The helper depends on the standard library alone: a brick that imports it must not
      # inherit anybody's dependency, least of all the engine's.
      - name: standard library only
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./brick | grep -v '^github.com/agentiik/brick-sdk' || true)
          if [ -n "$deps" ]; then echo "brick imports outside the standard library:"; echo "$deps"; exit 1; fi

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python the helper promises, and the newest.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: python
        run: python -m unittest discover -s tests -v
      # Installable as a package, with no dependency pulled in.
      - working-directory: python
        run: |
          python -m pip install --quiet .
          python -c "import agentiik_brick, importlib.metadata as m; assert not m.requires('agentiik-brick'), m.requires('agentiik-brick')"

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node the helper promises, which runs TypeScript with --experimental-strip-types,
        # and the current one.
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Built as it would be published, with nothing but Node's own modules imported.
      - run: |
          npm run build
          node -e "import('./dist/index.js').then(m => { if (typeof m.emit !== 'function') process.exit(1) })"
          if grep -hoE "from \"[^\"]+\"" dist/index.js | grep -v '"node:'; then echo "dist imports outside Node's standard library"; exit 1; fi

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # Each template carries the helper whole, so that a brick written from it needs nothing
      # installed; the copy is the helper, byte for byte, or the template ships an older one.
      - name: the templates carry this helper
        run: |
          cmp python/src/agentiik_brick/__init__.py templates/python/agentiik_brick.py
          cmp typescript/src/index.ts templates/typescript/brick.ts
      - name: install agk
        run: go install github.com/agentiik/agentiik/cmd/agk@main
      - name: build each template and run its cases
        run: templates/try.sh
